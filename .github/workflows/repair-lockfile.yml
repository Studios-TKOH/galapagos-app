name: Repair Lockfile Artifact

on:
  push:
    branches: [fix/s0-stabilization]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s0-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install
        run: npm ci --ignore-scripts
      - name: Commit repaired lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package lock"
          git push origin HEAD:fix/s0-stabilization
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
