name: S0 Audit Fix

on:
  push:
    branches: [fix/s0-stabilization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s0-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply compatible security fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Verify high/critical advisories are gone
        run: npm audit --audit-level=high
      - name: Commit lockfile security updates
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix(deps): apply npm audit security updates"
          git push origin HEAD:fix/s0-stabilization
